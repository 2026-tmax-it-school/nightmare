name: Review integration checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

# These checks validate only the review integration, not the Phaser game.
# Wire the review listener to real application CI when that CI is available.
permissions:
  contents: read

jobs:
  validate-review-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate review integration without API calls
        run: node --test .github/scripts/review-integration.test.mjs
